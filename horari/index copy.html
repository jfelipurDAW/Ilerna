<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../icon128.png">
  <title>Portal DAW1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ilerna: {
              blau: '#4fbccd',
              negre: '#060606',
              fons: '#ffffff'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-ilerna-negre m-0 min-h-screen text-gray-800">

  <header class="bg-ilerna-fons shadow-md border-b-4 border-ilerna-blau px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-ilerna-negre text-ilerna-fons p-2 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14l9-5-9-5-9 5 9 5z"></path>
          <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-ilerna-negre tracking-wide m-0">ILERNA <span class="text-ilerna-blau">DAW1</span></h1>
      </div>
    </div>
    <div class="hidden sm:block text-sm font-semibold text-gray-500 uppercase tracking-wider">
      Portal de l'Alumne
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 sm:p-10">
    
    <div class="mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
      <div>
        <h2 class="text-3xl font-bold text-white mb-2">Horari</h2>
        <p class="text-gray-400">Horari sincronitzat amb les entregues de classe.</p>
      </div>
      <a href="../" class="inline-flex items-center gap-2 bg-ilerna-fons text-ilerna-negre px-5 py-2.5 rounded-lg font-bold shadow-lg border-b-4 border-ilerna-blau hover:bg-gray-50 hover:-translate-y-1 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Tornar al portal
      </a>
    </div>

      
    <!-- 
      Contenidor principal que defineix l'alçada (80vh) i retalla el que sobri (overflow-hidden).
    -->
    <div class="bg-white p-0 sm:p-0 rounded-xl shadow-sm border-l-4 border-ilerna-blau h-[70vh] overflow-hidden">
      <!-- 
        TRUC CSS: Aquest div intern és molt més alt que el contenidor i el movem cap amunt 
        amb 'transform' per amagar les hores del matí.
        Pots ajustar el valor de 'translateY' per canviar l'hora d'inici visible.
        - Un valor més negatiu (ex: -700px) mostrarà hores més tardanes.
        - Un valor menys negatiu (ex: -600px) mostrarà hores més primerenques.
        El valor -650px fa que comenci a les 15:00 aproximadament.

        TRUC PER AMAGAR CAP DE SETMANA: 'width: 140%' estira el calendari horitzontalment.
        Com que mostrem 7 dies, en fer-ho més gran, els últims 2 (dissabte i diumenge) queden retallats.
      -->
      <div style="height: 2200px; width: 140%; transform: translateY(-650px);">
        <iframe 
          src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Europe%2FMadrid&showPrint=0&showNav=0&showDate=0&showCalendars=0&showTz=0&showTabs=0&mode=WEEK&title=Horari%20DAW1&showTitle=0&src=amZlbGlwdXIyMUBhbHVtbmVzLmlsZXJuYS5jb20&src=bXZsdHQ3bTE1dnFpMm0zNGZuOWVrbmlwMW1tbm41amlAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23039be5&color=%23d50000" 
          class="w-full h-full"
          style="border:0;" 
          frameborder="0">
        </iframe>
      </div>
    </div>

  </main>
</body>
</html>
