name: Sincronitzar a IlernaDAW

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Arxius sincronitzats
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config --global user.email "jfelipurDAW.github.io"
          git config --global user.name "jfelipurDAW"

          # 1. Clonar el repositori de DESTÍ en una carpeta anomenada 'desti'
          git clone https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/ilernadaw/ilernadaw.github.io.git desti

          # 2. Esborrar tot el contingut del destí (excepte la carpeta .git)
          # Això ens deixa el repositori net per rebre la versió nova
          find desti -mindepth 1 -maxdepth 1 -not -name ".git" -exec rm -rf {} +

          # 3. Copiar tot el contingut de l'origen al destí
          # Evitem copiar la carpeta .git i la carpeta de l'action mateixa
          cp -rv ./* desti/ 2>/dev/null || true
          rm -rf desti/desti  # Evitem que es copiï a si mateix si la carpeta 'desti' és a dins

          # 4. Fer el push
          cd desti
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Sincronització automàtica: $(date)"
            git push origin main
          else
            echo "No hi ha canvis per sincronitzar."
          fi