name: Sincronitzar a IlernaDAW

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          persist-credentials: false

      - name: Push a IlernaDAW
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Netegem qualsevol configuració prèvia d'autenticació de l'Action
          git remote rm destination || true
          
          # Intentem la connexió amb el format d'usuari:token
          git remote add destination https://jfelipurdaw:${TOKEN}@github.com/ilernadaw/ilernadaw.github.io.git
          
          # Forcem la pujada
          git push -f destination main