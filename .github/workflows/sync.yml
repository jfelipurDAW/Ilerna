name: Sincronitzar a IlernaDAW

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sincronització
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_TOKEN }}
        run: |
          # 1. Configurar identitat
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # 2. Clonar el repositori de DESTÍ en una carpeta a part
          git clone https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/ilernadaw/ilernadaw.github.io.git desti

          # 3. Copiar els fitxers de l'origen (actual) al destí (excepte la carpeta .git)
          # Això assegura que el destí tingui exactament el mateix que l'origen
          rsync -av --delete --exclude '.git' --exclude '.github' ./ desti/

          # 4. Fer el push des de la carpeta de destí
          cd desti
          git add .
          git commit -m "Sincronització automàtica: $(date)" || echo "No hi ha canvis per pujar"
          git push origin main