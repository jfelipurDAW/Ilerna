<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../icon128.png">
  <title>Portal DAW2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ilerna: {
              blau: '#4fbccd',
              negre: '#060606',
              fons: '#ffffff'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-ilerna-negre m-0 min-h-screen text-gray-800">

  <header class="bg-ilerna-fons shadow-md border-b-4 border-ilerna-blau px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <a href="../" class="flex items-center gap-3">
      <div class="bg-ilerna-negre text-ilerna-fons p-2 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14l9-5-9-5-9 5 9 5z"></path>
          <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-ilerna-negre tracking-wide m-0">ILERNA <span class="text-ilerna-blau">DAW2</span></h1>
      </div>
    </a>
    <a href="../" class="hidden sm:block text-sm font-semibold text-gray-500 uppercase tracking-wider hover:text-ilerna-blau transition-colors">
      Portal de l'Alumne
    </a>
  </header>

  <main class="max-w-4xl mx-auto p-6 sm:p-10">
    
    <div class="mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
      <div>
        <h2 class="text-3xl font-bold text-white mb-2">Consultor de Tutories</h2>
        <p class="text-gray-400">Consulta la disponibilitat de la Sandra.</p>
      </div>
      <a href="../" class="inline-flex items-center gap-2 bg-ilerna-fons text-ilerna-negre px-5 py-2.5 rounded-lg font-bold shadow-lg border-b-4 border-ilerna-blau hover:bg-gray-50 hover:-translate-y-1 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Tornar al portal
      </a>
    </div>

      
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-ilerna-blau mb-8">
        

      <div id="tutories-graella" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"></div>

      <div class="text-center mt-10">
        <a id="tutories-mail" href="mailto:sserrano@ilerna.com" class="group inline-flex items-center gap-2 bg-ilerna-blau text-white px-6 py-3 rounded-lg font-bold shadow-lg hover:bg-cyan-600 transition-all">
          <svg class="w-5 h-5 group-hover:animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          Enviar correu per concretar hora
        </a>
        <p class="text-black-400 text-sm mt-3 italic">Envieu un mail a la Sandra per acabar de concretar hora.</p>
      </div>

  </main>
  <script src="script.js"></script>
  <script src="../xatbot-widget.js"></script>
</body>
</html>
